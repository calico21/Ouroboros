[supervisord]
nodaemon=true
user=root
logfile=/app/applet/reports/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:node-server]
command=npm run dev -- --host 0.0.0.0 --port 3000
directory=/app/applet
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/applet/reports/logs/node_server.stdout.log
stderr_logfile=/app/applet/reports/logs/node_server.stderr.log
environment=NODE_ENV="production",PORT="3000"

[program:alphaforge-daemon]
command=python3 -u scripts/run_production_daemon.py --strategy afternoon_trend_continuation --symbol MNQ --mode paper
directory=/app/applet
autostart=true
autorestart=true
priority=20
stdout_logfile=/app/applet/reports/logs/production_daemon.stdout.log
stderr_logfile=/app/applet/reports/logs/production_daemon.stderr.log
environment=PYTHONPATH="/app/applet",PYTHONUNBUFFERED="1"
